name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get short commit
        id: meta
        shell: bash
        run: |
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Short commit: ${SHORT_SHA}"

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-s -w -X main.Version=${{ steps.meta.outputs.short_sha }}" \
            -o docker_stack_manager_linux_amd64 .

      - name: Create/update tag from commit (8 chars)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git tag -f "${TAG}" "${GITHUB_SHA}"
            git push origin "refs/tags/${TAG}" --force
            echo "Created tag ${TAG} -> ${GITHUB_SHA}"
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker_stack_manager-linux-amd64-${{ steps.meta.outputs.short_sha }}
          path: docker_stack_manager_linux_amd64